name: Build FFmpeg with libdvdnav

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-ffmpeg:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            subversion ragel curl texinfo g++ ed bison flex cvs yasm \
            automake libtool autoconf gcc cmake git make pkg-config \
            zlib1g-dev unzip pax nasm gperf autogen bzip2 \
            autoconf-archive p7zip-full meson clang python3-distutils \
            libtool-bin m4 gettext perl

      - name: Prepare build script (Enable libdvdnav)
        run: |
          set -x
          # Replace build_libdvdread with Meson version
          cat << 'EOF' > libdvdread_new.sh
          build_libdvdread() {
            build_libdvdcss
            if [ ! -f "libdvdread-7.0.1/unpacked.successfully" ]; then
              curl -L https://download.videolan.org/pub/videolan/libdvdread/7.0.1/libdvdread-7.0.1.tar.xz -o libdvdread-7.0.1.tar.xz
              tar -xf libdvdread-7.0.1.tar.xz
              touch libdvdread-7.0.1/unpacked.successfully
            fi
            cd libdvdread-7.0.1
              generic_meson_ninja_install
            cd ..
          }
          EOF
          
          # Replace build_libdvdnav with Meson version
          cat << 'EOF' > libdvdnav_new.sh
          build_libdvdnav() {
            if [ ! -f "libdvdnav-7.0.0/unpacked.successfully" ]; then
              curl -L https://download.videolan.org/pub/videolan/libdvdnav/7.0.0/libdvdnav-7.0.0.tar.xz -o libdvdnav-7.0.0.tar.xz
              tar -xf libdvdnav-7.0.0.tar.xz
              touch libdvdnav-7.0.0/unpacked.successfully
            fi
            cd libdvdnav-7.0.0
              generic_meson_ninja_install
            cd ..
          }
          EOF

          # Use perl for multi-line replacement of the functions
          perl -0777 -i -pe 's/build_libdvdread\(\) \{.*?\n\}/`cat libdvdread_new.sh`/ese' cross_compile_ffmpeg.sh
          perl -0777 -i -pe 's/build_libdvdnav\(\) \{.*?\n\}/`cat libdvdnav_new.sh`/ese' cross_compile_ffmpeg.sh

          # Add build_libdvdread and build_libdvdnav to the dependency build list
          # We insert them after build_libxvid as a safe spot near the end of the dependencies
          sed -i '/build_libxvid/a \   build_libdvdread\n   build_libdvdnav' cross_compile_ffmpeg.sh

          # Add --enable-libdvdnav and --enable-libdvdread to FFmpeg configure options
          sed -i 's/config_options+=" --enable-gnutls"/config_options+=" --enable-gnutls --enable-libdvdnav --enable-libdvdread"/' cross_compile_ffmpeg.sh

          # Disable SVT-AV1 build due to patch error, as it's not a core requirement for this task.
          sed -i 's/build_svt_av1=y/build_svt_av1=n/g' cross_compile_ffmpeg.sh

      - name: Run cross-compilation script
        id: build
        run: |
          # Use -d for defaults: win64, static, skip prompts
          ./cross_compile_ffmpeg.sh -d

      - name: Debug failure
        if: failure()
        run: |
          find sandbox -name config.log -exec echo "--- {} ---" \; -exec cat {} \;
          find sandbox -name meson-log.txt -exec echo "--- {} ---" \; -exec cat {} \;

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-dvdnav
          path: sandbox/redist/*.7z
