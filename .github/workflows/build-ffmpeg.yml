name: Build FFmpeg with libdvdnav

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-ffmpeg:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            subversion ragel curl texinfo g++ ed bison flex cvs yasm \
            automake libtool autoconf gcc cmake git make pkg-config \
            zlib1g-dev unzip pax nasm gperf autogen bzip2 \
            autoconf-archive p7zip-full meson clang python3-distutils \
            libtool-bin m4 gettext perl
          cmake --version
          meson --version
          ninja --version

      - name: Prepare build script (Enable libdvdnav)
        run: |
          # 1. Update DVD libraries to use latest versions and Meson
          # We use perl for reliable multi-line replacement of the function bodies.
          # Note: escape parentheses in the regex part.
          
          NEW_DVDREAD="build_libdvdread() {\n  build_libdvdcss\n  download_and_unpack_file https://download.videolan.org/pub/videolan/libdvdread/7.0.1/libdvdread-7.0.1.tar.xz libdvdread-7.0.1\n  cd libdvdread-7.0.1\n    generic_meson_ninja_install\n  cd ..\n}"
          perl -0777 -i -pe "s/build_libdvdread\(\) \{.*?cd \.\.\n\}/$NEW_DVDREAD/s" cross_compile_ffmpeg.sh

          NEW_DVDNAV="build_libdvdnav() {\n  download_and_unpack_file https://download.videolan.org/pub/videolan/libdvdnav/7.0.0/libdvdnav-7.0.0.tar.xz libdvdnav-7.0.0\n  cd libdvdnav-7.0.0\n    generic_meson_ninja_install\n  cd ..\n}"
          perl -0777 -i -pe "s/build_libdvdnav\(\) \{.*?cd \.\.\n\}/$NEW_DVDNAV/s" cross_compile_ffmpeg.sh

          # 2. Disable SVT-AV1 build to avoid patch errors and empty cmake_command issues
          sed -i 's/build_svt-av1/ # build_svt-av1/g' cross_compile_ffmpeg.sh
          sed -i 's/--enable-libsvtav1//g' cross_compile_ffmpeg.sh

          # 3. Enable libdvdread and libdvdnav in FFmpeg configuration
          sed -i 's/config_options+=" --enable-gnutls"/config_options+=" --enable-gnutls --enable-libdvdnav --enable-libdvdread"/' cross_compile_ffmpeg.sh

          # 4. Ensure DVD libraries are built during dependency phase
          # Remove any previous injections first to be idempotent
          sed -i '/build_libdvdread/d' cross_compile_ffmpeg.sh
          sed -i '/build_libdvdnav/d' cross_compile_ffmpeg.sh
          # Re-inject after srt build
          sed -i "/build_libsrt # requires gnutls/a \  build_libdvdread\n  build_libdvdnav" cross_compile_ffmpeg.sh

          echo "Build script prepared successfully."

      - name: Run cross-compilation script
        run: |
          # Use -d for defaults: win64, static, skip prompts
          ./cross_compile_ffmpeg.sh -d

      - name: Debug failure
        if: failure()
        run: |
          echo "Build failed. Searching for relevant logs..."
          # Print the last part of any config.log or meson-log.txt found
          find sandbox -name config.log -o -name meson-log.txt | while read log; do
            echo "--- $log (last 100 lines) ---"
            tail -n 100 "$log"
          done

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-dvdnav
          path: sandbox/redist/*.7z
