name: Build FFmpeg with libdvdnav

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-ffmpeg:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            subversion ragel curl texinfo g++ ed bison flex cvs yasm \
            automake libtool autoconf gcc cmake git make pkg-config \
            zlib1g-dev unzip pax nasm gperf autogen bzip2 \
            autoconf-archive p7zip-full meson clang python3-distutils \
            libtool-bin m4 gettext perl

      - name: Prepare build script (Enable libdvdnav)
        run: |
          # Use a heredoc to define the new functions
          cat << 'EOF' >> cross_compile_ffmpeg.sh

          # Redefining DVD libraries to use Meson and latest versions
          build_libdvdread() {
            build_libdvdcss
            if [ ! -f "libdvdread-7.0.1/unpacked.successfully" ]; then
              echo "Downloading libdvdread 7.0.1..."
              curl -sL https://download.videolan.org/pub/videolan/libdvdread/7.0.1/libdvdread-7.0.1.tar.xz -o libdvdread-7.0.1.tar.xz
              tar -xf libdvdread-7.0.1.tar.xz
              touch libdvdread-7.0.1/unpacked.successfully
            fi
            cd libdvdread-7.0.1
              generic_meson_ninja_install
            cd ..
          }

          build_libdvdnav() {
            if [ ! -f "libdvdnav-7.0.0/unpacked.successfully" ]; then
              echo "Downloading libdvdnav 7.0.0..."
              curl -sL https://download.videolan.org/pub/videolan/libdvdnav/7.0.0/libdvdnav-7.0.0.tar.xz -o libdvdnav-7.0.0.tar.xz
              tar -xf libdvdnav-7.0.0.tar.xz
              touch libdvdnav-7.0.0/unpacked.successfully
            fi
            cd libdvdnav-7.0.0
              generic_meson_ninja_install
            cd ..
          }
          EOF

          # Insert calls into build_ffmpeg_dependencies after build_libsrt
          sed -i '/build_libsrt # requires gnutls/a \  build_libdvdread\n  build_libdvdnav' cross_compile_ffmpeg.sh

          # Disable SVT-AV1 build (both call and FFmpeg config)
          sed -i 's/build_svt-av1/ # build_svt-av1/g' cross_compile_ffmpeg.sh
          sed -i 's/--enable-libsvtav1//g' cross_compile_ffmpeg.sh

          # Add --enable-libdvdnav and --enable-libdvdread to FFmpeg configure options
          # Appending to gnutls line as a safe anchor
          sed -i 's/config_options+=" --enable-gnutls"/config_options+=" --enable-gnutls --enable-libdvdnav --enable-libdvdread"/' cross_compile_ffmpeg.sh

          echo "Build script prepared successfully."

      - name: Run cross-compilation script
        run: |
          # Use -d for defaults: win64, static, skip prompts
          ./cross_compile_ffmpeg.sh -d

      - name: Debug failure
        if: failure()
        run: |
          echo "Build failed. Searching for relevant logs..."
          find sandbox -name config.log -exec echo "--- {} ---" \; -exec cat {} \;
          find sandbox -name meson-log.txt -exec echo "--- {} ---" \; -exec cat {} \;

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-dvdnav
          path: sandbox/redist/*.7z
